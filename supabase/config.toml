# Auth is verified by calling Supabase Auth inside the handler. This supports
# signing keys that the legacy gateway JWT verifier does not support.
[functions.google-places]
verify_jwt = false

# The handler verifies every bearer token with Supabase Auth before Google calls.
[functions.image-recognition]
verify_jwt = false

# The YH context endpoint verifies bearer tokens inside the same handler.
[functions.image-recognition-context-yh]
verify_jwt = false
